# Makes a release of Legato: the next version (the newest vX.Y.Z tag, bumped),
# tested, built for every platform with the web UI inside, and published as a
# GitHub release that Legato's updater installs. When desktop/ changed since
# the last release that has one (or desktop=always), the desktop app is built
# too and attached to the same release: an AppImage, which updates itself
# from these releases, and a macOS disk image.
#
#   gh workflow run release -f bump=patch [-f desktop=always] [-f android=always]
name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        type: choice
        options: [patch, minor, major]
        default: patch
      desktop:
        description: Build the desktop app (auto builds it when desktop/ changed)
        type: choice
        options: [auto, always, never]
        default: auto
      android:
        description: Build signed Android APK (auto compares inputs to last APK-bearing release)
        type: choice
        options: [auto, always, never]
        default: auto

permissions:
  contents: write # the tag and the release
  id-token: write # build provenance
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      desktop: ${{ steps.desktop.outputs.build }}
      android: ${{ steps.android.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # every tag, to find the newest release

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          version: 11 # as used to write web/pnpm-lock.yaml

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Next version
        id: version
        run: echo "version=$(bash scripts/next-version.sh '${{ inputs.bump }}')" >> "$GITHUB_OUTPUT"

      - name: Whether to build the desktop app
        id: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "build=$(bash scripts/desktop-changed.sh '${{ inputs.desktop }}')" >> "$GITHUB_OUTPUT"

      - name: Whether to build Android
        id: android
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANDROID_MODE: ${{ inputs.android }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! python3 scripts/android-release.py decide "$ANDROID_MODE" "$GITHUB_SHA" > "$RUNNER_TEMP/android-decision.json"; then
            echo 'Android decision failed; no skip inferred.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "build=$(jq -r .build "$RUNNER_TEMP/android-decision.json")" >> "$GITHUB_OUTPUT"
          {
            echo '### Android release decision'
            echo "Source: $GITHUB_SHA; mode: $ANDROID_MODE"
            jq -r '"Baseline: \(.baseline // "none"); build: \(.build); reason: \(.reason)"' "$RUNNER_TEMP/android-decision.json"
          } >> "$GITHUB_STEP_SUMMARY"
          if jq -e .build "$RUNNER_TEMP/android-decision.json" >/dev/null; then
            python3 scripts/android-release.py preflight "$VERSION"
          fi

      - name: Web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Test
        run: |
          go vet ./...
          go test -short -timeout 20m ./...

      - name: Build
        run: task release:dist VERSION='${{ steps.version.outputs.version }}'

      - name: Check the build reports its version
        run: |
          got="$(HOME="$RUNNER_TEMP" dist/legato-linux-amd64 version)"
          test "$got" = "legato ${{ steps.version.outputs.version }}" || { echo "built binary says: $got"; exit 1; }

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/legato-*

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" dist/legato-* dist/SHA256SUMS \
            --target "$GITHUB_SHA" --title "$VERSION" --generate-notes

  # The desktop app for Linux: an AppImage. It carries the build machine's
  # WebKitGTK, and 22.04's crashed (a libstdc++ assertion in the page
  # process) on pages a newer one shows, so it is built on 24.04, and needs
  # glibc 2.39 or later. It finds its updates in these releases.
  desktop-linux:
    needs: release
    if: needs.release.outputs.desktop == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.version }}

      # GStreamer's plugins go into the AppImage (bundleMediaFramework):
      # without them WebKitGTK froze for good on a page with a <video>
      # (LEG-162). good: MP4, WebM, VP8/9; libav: H.264, AAC.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libudev-dev libssl-dev patchelf file \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-gl gstreamer1.0-libav

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Test
        working-directory: desktop
        run: |
          pnpm exec tsc -b
          pnpm exec vite build
          node --test "tests/*.test.ts"
          (cd src-tauri && cargo test --lib)

      - name: Build
        working-directory: desktop
        env:
          LEGATO_DESKTOP_VERSION: ${{ needs.release.outputs.version }}
        run: pnpm tauri build --bundles appimage --config "{\"version\":\"${VERSION#v}\"}"

      - name: Check the AppImage carries GStreamer's plugins
        working-directory: desktop
        run: sh scripts/appimage-media-check.sh src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Name it
        run: |
          mkdir -p dist
          cp desktop/src-tauri/target/release/bundle/appimage/*.AppImage dist/legato-desktop-x86_64.AppImage
          (cd dist && sha256sum legato-desktop-x86_64.AppImage > legato-desktop-SHA256SUMS)

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/legato-desktop-x86_64.AppImage

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$VERSION" dist/legato-desktop-x86_64.AppImage dist/legato-desktop-SHA256SUMS

  # The desktop app for Apple Silicon Macs: a disk image to install from, and
  # Legato.app as a gzipped tar, which an installed copy updates itself from
  # (desktop/src-tauri/src/updates.rs). Ad hoc signed, not notarized.
  desktop-macos:
    needs: release
    if: needs.release.outputs.desktop == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.version }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      # The runner's malware scanner, XProtect, can hold a new disk image
      # open, and hdiutil then fails with "Resource busy". Stop it first, and
      # try the build three times (a retry is quick: the compile is cached).
      - name: Stop XProtect
        run: |
          sudo pkill -9 XProtect || true
          for _ in $(seq 10); do pgrep XProtect >/dev/null || break; sleep 3; done

      - name: Build
        working-directory: desktop
        env:
          LEGATO_DESKTOP_VERSION: ${{ needs.release.outputs.version }}
        run: |
          for attempt in 1 2 3; do
            pnpm tauri build --bundles app,dmg --config "{\"version\":\"${VERSION#v}\"}" && exit 0
            echo "::warning::build attempt $attempt failed; trying again"
            sleep 20
          done
          exit 1

      # COPYFILE_DISABLE keeps macOS's tar from adding ._ files for extended
      # attributes; the code signature is in the bundle's own files.
      - name: Name it
        run: |
          mkdir -p dist
          cp desktop/src-tauri/target/release/bundle/dmg/*.dmg dist/legato-desktop-macos-arm64.dmg
          COPYFILE_DISABLE=1 tar -czf dist/legato-desktop-macos-arm64.app.tar.gz -C desktop/src-tauri/target/release/bundle/macos Legato.app
          (cd dist && shasum -a 256 legato-desktop-macos-arm64.dmg legato-desktop-macos-arm64.app.tar.gz > legato-desktop-macos-SHA256SUMS)

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/legato-desktop-macos-arm64.dmg
            dist/legato-desktop-macos-arm64.app.tar.gz

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$VERSION" dist/legato-desktop-macos-arm64.dmg dist/legato-desktop-macos-arm64.app.tar.gz dist/legato-desktop-macos-SHA256SUMS

  android:
    needs: release
    if: needs.release.outputs.android == 'true'
    runs-on: ubuntu-24.04
    environment: android-release
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.release.outputs.version }}
      LEGATO_ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.version }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools # v3 defaults include the retired SDK package "tools"

      - name: SDK36 tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      # Only public dependencies/wrapper: never signing inputs or configuration caches.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: android-gradle-${{ runner.os }}-${{ hashFiles('mobile/**/*.gradle.kts', 'mobile/gradle/**', 'mobile/gradle.properties') }}

      - name: Reuse an already published APK on same-tag recovery
        id: stage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/android-release.py preflight "$VERSION"
          python3 scripts/android-release.py stage "$VERSION" dist > "$RUNNER_TEMP/android-stage.json"
          echo "build=$(jq -r .build "$RUNNER_TEMP/android-stage.json")" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/android-stage.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Test and package with the durable private signer
        if: steps.stage.outputs.build == 'true'
        env:
          LEGATO_ANDROID_RELEASE_TAG: ${{ needs.release.outputs.version }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          LEGATO_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          LEGATO_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LEGATO_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'Missing Android release signing secrets' >&2; exit 1; }
          test -n "$LEGATO_ANDROID_CERT_SHA256" || { echo 'Missing approved ANDROID_CERT_SHA256 variable' >&2; exit 1; }
          export LEGATO_ANDROID_KEYSTORE="$RUNNER_TEMP/legato-release.jks"
          trap 'python3 -c "import os; os.unlink(os.environ[\"LEGATO_ANDROID_KEYSTORE\"])"' EXIT
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$LEGATO_ANDROID_KEYSTORE"
          unset ANDROID_KEYSTORE_BASE64
          mobile/gradlew -p mobile --no-daemon --no-configuration-cache --max-workers=2 :app:testReleaseUnitTest :app:assembleRelease
          cp mobile/app/build/outputs/apk/release/app-release.apk dist/legato-android.apk

      - name: Verify actual APK identity, version and certificate
        run: python3 scripts/android-release.py verify "$VERSION" dist/legato-android.apk

      - uses: actions/attest-build-provenance@v2
        if: steps.stage.outputs.build == 'true'
        with:
          subject-path: dist/legato-android.apk

      - name: Publish immutable APK and Android-only checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/android-release.py publish "$VERSION" dist
          echo "Android APK and checksum published at $VERSION (or original assets verified)." >> "$GITHUB_STEP_SUMMARY"

      - name: Report partial completion
        if: failure()
        run: |
          echo "::error::CLI release $VERSION exists, but Android did not complete. Re-run only the failed Android job; do not re-run all jobs or replace an existing APK. See mobile/README.md."
          echo "Android FAILED for $VERSION: CLI release may already be available. Re-run failed jobs after fixing prerequisites; see mobile/README.md." >> "$GITHUB_STEP_SUMMARY"
