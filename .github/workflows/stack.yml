# Re-posts ci/stack on the PRs of a GitHub stack (LEG-629) on the events that
# must not cancel or restart ci.yml's build: a review of the top PR (its
# approval may be what the PRs below wait for) and a PR closed unmerged (the
# PR below a closed top becomes the top, but nothing builds it). See
# scripts/stack-status.cjs and ci.yml's header.
#
# These events run the workflow as the PR's merge commit has it, so a stack
# whose branches predate this file is untouched.
name: stack

on:
  pull_request_review:
    types: [submitted, dismissed]
  pull_request:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: stack-${{ github.event.pull_request.number }}

jobs:
  review:
    if: >-
      github.event_name == 'pull_request_review' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/stack-status.cjs
          sparse-checkout-cone-mode: false

      # The review's copy of the PR may be stale: read it again.
      - name: Post the top build's result, now reviewed
        uses: actions/github-script@v7
        with:
          script: |
            const stackStatus = require("./scripts/stack-status.cjs");
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: context.payload.pull_request.number });
            await stackStatus({ github, context, pr }).onReview();

  closed:
    if: >-
      github.event_name == 'pull_request' && !github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/stack-status.cjs
          sparse-checkout-cone-mode: false

      - name: Point the stack at its new top
        uses: actions/github-script@v7
        with:
          script: |
            const stackStatus = require("./scripts/stack-status.cjs");
            await stackStatus({ github, context, pr: context.payload.pull_request }).onClose();
