[package]
name = "legato-desktop"
version = "0.1.0"
edition = "2021"
description = "Legato's desktop app: every server in one window, paired by phrase, approvals signed with a security key"
license = "MIT"

[lib]
name = "legato_desktop"
path = "src/lib.rs"

[[bin]]
name = "legato-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(target_os = "macos")'.build-dependencies]
# Builds and links touchid/, the Swift that reaches the Secure Enclave.
swift-rs = { version = "1.0.9", features = ["build"] }

[dependencies]
# "unstable" gives a window several webviews: the shell beside each server's page.
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
ctap-hid-fido2 = "3.6"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
aes-gcm = "0.10"
p256 = { version = "0.13", features = ["arithmetic"] }
num-bigint = "0.4"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
dirs = "5"
mdns-sd = "0.21"
# Unpacking a Mac update: Legato.app as a gzipped tar.
tar = "0.4"
flate2 = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_6"] }
gtk = "0.18"

[dev-dependencies]
rcgen = "0.13"
ciborium = "0.2"
tempfile = "3"
# A software stand-in for the Secure Enclave in touchid's tests.
p256 = { version = "0.13", features = ["ecdsa"] }
