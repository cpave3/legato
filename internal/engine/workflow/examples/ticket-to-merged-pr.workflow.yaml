schema_version: 2
name: ticket-to-merged-pr
title: Ticket to merged pull request
tags: [tickets]
run_title: ${{ workflow.inputs.task.id }} to a merged pull request
description: >-
  Start the task's own agent on a macro in a fresh clone of the repository,
  and keep it once it reports its pull request. Run review-loop on that
  pull request and its stack: review in passes while the agent fixes and
  answers the findings, mark the drafts ready once approved, and look after
  them until they merge. On merged, close the task's Burnlite ticket (a task
  that is not from Burnlite is skipped) and stop the agent. Otherwise note
  the task and leave the ticket open: closed or idle stops the agent, stuck
  or ended leaves it running for the operator to take over.
inputs:
  task:
    type: task
    required: true
    description: The task to implement
  repo:
    type: string
    required: true
    description: GitHub owner/repository the agent works in a fresh clone of
  macro:
    type: string
    default: Implement
    description: The macro the agent is started on; it must open a pull request
  reviewer:
    type: string
    default: ""
    description: Agent tool that reviews, or tool:tier (empty for this Legato's review pass setting)
on:
  task.entered_column:
    column: Doing
    enabled: false
    confirm: true
    inputs:
      task: ${{ event.task }}
steps:
  - id: implement
    title: Implement the task and open a pull request
    type: agent.run
    with:
      on: ${{ workflow.inputs.task }}
      macro: ${{ workflow.inputs.macro }}
      repo: ${{ workflow.inputs.repo }}
    outputs:
      pr_number: {type: integer, description: The number of the pull request the agent opened}
  - id: review
    title: Review, mark ready and look after it to the merge
    type: workflow.run
    # A refused, failed or stopped review-loop waits for the operator:
    # Retry (the same child and loop), Skip or Stop.
    on_failure: pause
    with:
      workflow: review-loop
      inputs:
        repo: ${{ workflow.inputs.repo }}
        pr_number: ${{ steps.implement.outputs.pr_number }}
        scope: stack
        agent_author: true
        ready: true
        steward: true
        reviewer: ${{ workflow.inputs.reviewer }}
  - id: close-ticket
    title: Close the Burnlite ticket
    if: {field: steps.review.outputs.outcome, equals: merged}
    type: burnlite.task.close
    with:
      task: ${{ workflow.inputs.task }}
      summary: Merged in https://github.com/${{ workflow.inputs.repo }}/pull/${{ steps.implement.outputs.pr_number }}
      optional: true
  - id: note-stopped
    title: Note the task
    if: {field: steps.review.outputs.outcome, in: [closed, idle]}
    type: task.note
    with:
      task: ${{ workflow.inputs.task }}
      body: >-
        The review loop on ${{ workflow.inputs.repo }}#${{ steps.implement.outputs.pr_number }}
        ended ${{ steps.review.outputs.outcome }} without a merge. The ticket
        stays open and the agent was stopped.
  - id: note-running
    title: Note the task
    if: {field: steps.review.outputs.outcome, in: [stuck, ended]}
    type: task.note
    with:
      task: ${{ workflow.inputs.task }}
      body: >-
        The review loop on ${{ workflow.inputs.repo }}#${{ steps.implement.outputs.pr_number }}
        ended ${{ steps.review.outputs.outcome }} without a merge. The ticket
        stays open and the agent keeps running for the operator to take over.
  - id: stop
    title: Stop the agent
    if: {field: steps.review.outputs.outcome, in: [merged, closed, idle]}
    type: agent.stop
    with:
      task: ${{ workflow.inputs.task }}
