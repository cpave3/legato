schema_version: 2
name: address-feedback
title: Address feedback
tags: [reviews]
run_title: Address feedback on ${{ workflow.inputs.repo }}#${{ workflow.inputs.pr_number }}
description: >-
  When someone requests changes on a pull request one of your tasks owns,
  give the task's own agent your Address feedback macro (starting it if
  none is running). Paused until you switch it on.
inputs:
  task: {type: task, required: true}
  repo: {type: string, required: true, description: GitHub owner/repository}
  pr_number: {type: integer, required: true, description: Pull request number}
on:
  pr.changes_requested:
    enabled: false
    inputs:
      task: ${{ event.task }}
      repo: ${{ event.repo }}
      pr_number: ${{ event.pr_number }}
steps:
  - id: address
    title: Address the feedback
    type: agent.dispatch
    with:
      task: ${{ workflow.inputs.task }}
      repo: ${{ workflow.inputs.repo }}
      pr_number: ${{ workflow.inputs.pr_number }}
      macro: Address feedback
      working_dir: ${{ workflow.inputs.task.working_dir }}
