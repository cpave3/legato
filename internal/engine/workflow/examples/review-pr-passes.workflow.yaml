schema_version: 1
name: review-pr-passes
title: Review pull request in passes
run_title: Review loop on ${{ workflow.inputs.repo }}#${{ workflow.inputs.pr_number }}
description: >-
  Review an open pull request in passes, each posted as a GitHub review from
  Legato's reviewer App, until a clean pass approves it. The branch's owner
  pushes fixes and replies in the review threads between passes.
inputs:
  repo:
    type: string
    required: true
    description: GitHub owner/repository
  pr_number:
    type: integer
    required: true
    description: Pull request number
  max_passes:
    type: integer
    default: 0
    description: Most passes before the loop goes stuck (0 for this Legato's review pass setting)
  reviewer:
    type: string
    default: ""
    description: Agent tool that reviews (empty for this Legato's review pass setting)
  agent_author:
    type: boolean
    default: false
    description: Have the agent of the board task the pull request belongs to fix and answer the findings
steps:
  - id: review
    title: Review in passes
    type: github.pr.review_passes
    with:
      repo: ${{ workflow.inputs.repo }}
      pr_number: ${{ workflow.inputs.pr_number }}
      max_passes: ${{ workflow.inputs.max_passes }}
      reviewer: ${{ workflow.inputs.reviewer }}
      agent_author: ${{ workflow.inputs.agent_author }}
    outputs:
      outcome: {type: string, description: "approved, stuck, closed or cancelled"}
      passes: {type: integer}
      findings: {type: integer}
      reviews: {type: json, description: "The reviews posted, with their links"}
      summary_path: {type: string, description: "A Markdown summary of the loop"}
      linked_task: {type: string, description: "The board task the pull request belongs to, or empty"}
  - id: note
    title: Note the outcome on the linked task
    type: task.note
    with:
      task: ${{ steps.review.outputs.linked_task }}
      optional: true
      body_path: ${{ steps.review.outputs.summary_path }}
