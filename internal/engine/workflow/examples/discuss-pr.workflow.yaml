schema_version: 2
name: discuss-pr
title: Discuss pull request
run_title: Discuss ${{ workflow.inputs.repo }}#${{ workflow.inputs.pr_number }}
description: >-
  Start an agent in a fresh clone that gets across a pull request's change
  set and answers your questions about it. The run ends when the agent does.
inputs:
  repo:
    type: string
    required: true
    description: GitHub owner/repository
  pr_number:
    type: integer
    required: true
    description: Pull request number
steps:
  - id: discuss
    title: Discuss pull request
    type: agent.run
    wait_for: [complete]
    with:
      name: Discuss ${{ workflow.inputs.repo }}#${{ workflow.inputs.pr_number }}
      repo: ${{ workflow.inputs.repo }}
      keep: true
      prompt: |
        Pull request ${{ workflow.inputs.repo }}#${{ workflow.inputs.pr_number }}:
        https://github.com/${{ workflow.inputs.repo }}/pull/${{ workflow.inputs.pr_number }}

        Check the pull request out (gh pr checkout ${{ workflow.inputs.pr_number }}),
        read its description and its change set against the base branch, and the
        code around it, until you can explain what it does and why. Then say in a
        few lines what it changes, and wait for my questions. Do not change the
        code or post anything to the pull request.
  - id: end
    title: End the discussion
    type: agent.stop
    wait_for: [ended]
    with:
      agent: {from: discuss}
