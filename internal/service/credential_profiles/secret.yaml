# A value the agent gets on request, with `legato credential get` or
# `legato credential exec`. The agent holds the value while it uses it, so
# the default asks once per agent session.
name: secret
description: A value handed to the agent on request
issuer: static
channels: [helper]
accepts: [value, userpass, keypair, oauth-client, oauth-refresh]
policy:
  - { operation: read, approve: session }
