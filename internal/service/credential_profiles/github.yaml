# GitHub through a GitHub App. The person creates the App (contents read and
# write, pull requests read and write, metadata read; issues read and write
# for gh's issue commands; actions read, and write to re-run, cancel and
# dispatch, for gh's run, workflow and cache commands; workflows read and
# write for pushes that change .github/workflows), installs it on the
# repositories, and gives Legato its private key. Agents read the listed
# repositories with short-lived read tokens from Legato's git credential
# helper; pushes go through Legato's proxy, which reads each ref a push
# updates and pushes with a write token made for that push alone.
name: github
description: GitHub through a GitHub App; pushes checked branch by branch
issuer: jwt-exchange
channels: [http-proxy]
accepts: [keypair]
inspector: rest
upstream: https://api.github.com
api_prefix: /api
git: https://github.com
key: { header: Authorization, format: "Bearer {secret}" }
env:
  LEGATO_GITHUB_API_URL: "{base_url}/api"
  LEGATO_GITHUB_TOKEN: "{placeholder}"
jwt_exchange:
  headers:
    Accept: application/vnd.github+json
    X-GitHub-Api-Version: "2022-11-28"
  jwt:
    alg: RS256
    claims: { iss: "{settings.client_id}", iat: "{now-60}", exp: "{now+540}" }
  lookup:
    url: "https://api.github.com/repos/{owner}/{repo}/installation"
    set: { installation: "$.id" }
    # The installation's permissions: a push that changes workflows is
    # refused before anyone is asked when the App lacks workflows: write.
    granted: "$.permissions"
    # The App's slug: its posts are <slug>[bot]'s, which is how Legato tells
    # a comment it posted from one with a copy of its marker.
    actor: "$.app_slug"
  exchange:
    method: POST
    url: "https://api.github.com/app/installations/{installation}/access_tokens"
    body: { repositories: ["{repo}"], permissions: "{permissions}" }
    token: "$.token"
    expires_at: "$.expires_at"
  revoke:
    method: DELETE
    url: "https://api.github.com/installation/token"
    auth: issued
# What each operation's token may do.
permissions:
  git.read: { contents: read, metadata: read }
  api.read: { contents: read, metadata: read, pull_requests: read }
  git.push: { contents: write }
  # A push whose new commits change a file under .github/workflows (Legato
  # reads each push against its copy of the repository). GitHub refuses
  # such a push without the workflows permission, and a workflow runs with
  # the repository's secrets once pushed, so it is asked for apart from
  # git.push.
  git.push-workflows: { contents: write, workflows: write }
  # A pull request that is not a draft, from one branch: through the REST
  # API, or gh pr create without --draft (given to the gh wrapper for one
  # command and revoked after it).
  pr.create: { pull_requests: write, contents: read, metadata: read }
  # A draft pull request from one branch: through the REST API (the proxy
  # holds the token), or gh pr create --draft (given to the gh wrapper for
  # one command and revoked after it).
  pr.create-draft: { pull_requests: write, contents: read, metadata: read }
  # gh's other pull request commands (gh pr edit, comment, review, ...),
  # given to the gh wrapper for one command and revoked after it.
  pr.write: { pull_requests: write, contents: read, metadata: read }
  # gh pr ready: GitHub wants contents: write for it too, so Legato marks
  # the pull request itself and the agent never holds this token.
  pr.ready: { pull_requests: write, contents: write, metadata: read }
  # gh's issue commands (gh issue create, edit, comment, close, ...) and gh
  # api writes under repos/<owner>/<repo>/issues, for one command.
  issue.write: { issues: write, metadata: read }
  # gh run list/view/watch/download, gh workflow list/view, gh cache list,
  # and gh api reads under repos/<owner>/<repo>/actions. Kept apart from
  # api.read, so an App without the Actions permission still gets read
  # tokens for everything else.
  actions.read: { actions: read, contents: read, metadata: read }
  # gh run rerun/cancel/delete, gh workflow run/enable/disable, gh cache
  # delete, and gh api writes under repos/<owner>/<repo>/actions, for one
  # command.
  actions.write: { actions: write, contents: read, metadata: read }
routes:
  - { method: GET, path: "/repos/{owner}/{repo}/**", operation: api.read, resource: "github:{owner}/{repo}" }
  - { method: POST, path: "/repos/{owner}/{repo}/pulls", when: { $.draft: true }, operation: pr.create-draft, resource: "github:{owner}/{repo}@refs/heads/{$.head}" }
  - { method: POST, path: "/repos/{owner}/{repo}/pulls", operation: pr.create, resource: "github:{owner}/{repo}@refs/heads/{$.head}" }
# {repositories} is each of settings.repositories; one rule each.
policy:
  - { operation: [git.read, api.read, actions.read], resource: "github:{repositories}", approve: auto }
  - { operation: [git.push, git.push-workflows, pr.create, pr.create-draft], resource: "github:{repositories}@refs/heads/legato/**", approve: session }
  - { operation: [git.push, git.push-workflows, pr.create, pr.create-draft], resource: "github:{repositories}@refs/heads/**", approve: request, signed: true }
  - { operation: [pr.write, pr.ready, issue.write, actions.write], resource: "github:{repositories}", approve: session }
  - { operation: [git.push-default, git.push-tag, git.delete-ref], approve: deny }
