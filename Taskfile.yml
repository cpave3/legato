version: "3"

tasks:
  build:
    desc: Build the legato binary (TUI only — no web dashboard)
    cmds:
      - go build -o legato ./cmd/legato/

  build:full:
    desc: Build the frontend and the legato binary (TUI + web dashboard)
    cmds:
      - task: web:build
      - task: build

  test:
    desc: Run all tests
    cmds:
      - go test ./... -count=1

  test:verbose:
    desc: Run all tests with verbose output
    cmds:
      - go test ./... -v -count=1

  test:build-contract:
    desc: Verify frontend builds preserve the TUI-only Go build fallback
    cmds:
      - task: web:build
      - test -f internal/server/static/dist/.gitkeep
      - test -s internal/server/static/dist/build-id
      - go test ./internal/server/static -count=1

  test:race:
    desc: Run all tests with race detector
    cmds:
      - go test -race ./... -count=1

  test:cover:
    desc: Run tests with coverage
    cmds:
      - go test ./... -count=1 -coverprofile=coverage.out
      - go tool cover -func=coverage.out | tail -1

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  check:
    desc: Build, test, vet, and lint
    cmds:
      - task: build
      - task: test
      - task: vet
      - task: lint

  run:
    desc: Run the application
    cmds:
      - go run ./cmd/legato

  run:hot:
    desc: Run the built TUI and reload it after successful binary rebuilds
    cmds:
      - ./legato --hot-reload

  server:hot:
    desc: Run the built web server and reload it after successful binary rebuilds
    cmds:
      - ./legato --hot-reload serve --port ${LEGATO_SERVER_PORT:-3080}

  install:
    desc: Install legato to $GOPATH/bin
    cmds:
      - go install ./cmd/legato/

  link:
    desc: Build legato and symlink it into $GOBIN (defaults to $GOPATH/bin)
    cmds:
      - task: build
      - |
        bin_dir="$(go env GOBIN)"
        bin_dir="${bin_dir:-$(go env GOPATH)/bin}"
        mkdir -p "$bin_dir"
        ln -sfn "{{.ROOT_DIR}}/legato" "$bin_dir/legato"

  web:build:
    desc: Build the frontend
    dir: web
    cmds:
      - pnpm run build

  web:dev:
    desc: Start the frontend dev server
    dir: web
    cmds:
      - pnpm run dev

  server:restart:
    desc: Stop the Legato server, rebuild the embedded web UI, and restart it
    cmds:
      - ./scripts/restart-legato-server.sh

  web:test:
    desc: Run frontend tests
    dir: web
    cmds:
      - pnpm run test

  mobile:apk:
    desc: Build a standalone Android APK that runs without Metro
    cmds:
      - ./scripts/mobile-android.sh apk

  mobile:install:
    desc: Build, install, and launch the standalone Android app
    cmds:
      - ./scripts/mobile-android.sh install

  mobile:dev-apk:
    desc: Build an Android development APK for Metro and Fast Refresh
    cmds:
      - ./scripts/mobile-android.sh dev-apk

  mobile:dev:
    desc: Serve updates to an installed development APK over the LAN
    dir: mobile
    cmds:
      - pnpm start --dev-client --lan

  mobile:device:
    desc: Build, install, and launch the development app on a connected device
    cmds:
      - ./scripts/mobile-android.sh device

  mobile:eas:
    desc: Build an internal-distribution Android APK with EAS
    dir: mobile
    cmds:
      - pnpm exec eas build --platform android --profile preview

  extension:test:
    desc: Run browser extension tests
    dir: browser-extension
    cmds:
      - pnpm test

  extension:build:
    desc: Build the unpacked Chrome extension
    dir: browser-extension
    cmds:
      - pnpm build

  extension:lint:
    desc: Lint the browser extension
    dir: browser-extension
    cmds:
      - pnpm lint

  streamdeck:build:
    desc: Build the Stream Deck plugin binary
    dir: streamdeck
    cmds:
      - go build -o plugin/bin/legato-streamdeck ./cmd/legato-streamdeck

  streamdeck:dev:
    desc: Build, deploy to OpenDeck, and restart the plugin (no zip/reload needed)
    dir: streamdeck
    cmds:
      - ./scripts/dev.sh

  streamdeck:package:
    desc: Build and assemble the .sdPlugin folder
    dir: streamdeck
    cmds:
      - task: streamdeck:build
      - ./scripts/package.sh

  install:tools:
    desc: Install development tools
    cmds:
      - go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
