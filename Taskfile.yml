version: "3"

tasks:
  build:
    desc: Build the legato binary (TUI only — no web dashboard)
    # Without C: one static binary that runs on any Linux, and cross-compiles
    # with GOOS and GOARCH alone. TestLegatoBuildsWithoutC keeps it possible.
    env:
      CGO_ENABLED: "0"
    cmds:
      - go build -o legato ./cmd/legato/

  build:release:
    desc: Build one release binary stamped with VERSION, for GOOS and GOARCH (run web:build first to embed the web UI)
    requires:
      vars: [VERSION]
    env:
      CGO_ENABLED: "0"
    cmds:
      - go build -trimpath -ldflags "-s -w -X github.com/cpave3/legato/internal/engine/version.stamped={{.VERSION}}" -o {{.OUTPUT | default "legato"}} ./cmd/legato/

  release:dist:
    desc: Build every release binary for VERSION into dist/, with SHA256SUMS (what the release workflow publishes)
    requires:
      vars: [VERSION]
    cmds:
      - rm -rf dist && mkdir -p dist
      - task: web:build
      - for: [linux/amd64, linux/arm64, darwin/arm64]
        cmd: GOOS={{splitList "/" .ITEM | first}} GOARCH={{splitList "/" .ITEM | last}} task build:release VERSION={{.VERSION}} OUTPUT=dist/legato-{{splitList "/" .ITEM | first}}-{{splitList "/" .ITEM | last}}
      - cd dist && sha256sum legato-* > SHA256SUMS

  build:full:
    desc: Build the frontend and the legato binary (TUI + web dashboard)
    cmds:
      - task: web:build
      - task: build

  test:
    desc: Run all tests
    cmds:
      - go test ./... -count=1

  test:verbose:
    desc: Run all tests with verbose output
    cmds:
      - go test ./... -v -count=1

  test:build-contract:
    desc: Verify frontend builds preserve the TUI-only Go build fallback
    cmds:
      - task: web:build
      - test -f internal/server/static/dist/.gitkeep
      - test -s internal/server/static/dist/build-id
      - go test ./internal/server/static -count=1

  test:race:
    desc: Run all tests with race detector
    cmds:
      - go test -race ./... -count=1

  test:cover:
    desc: Run tests with coverage
    cmds:
      - go test ./... -count=1 -coverprofile=coverage.out
      - go tool cover -func=coverage.out | tail -1

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  check:
    desc: Build, test, vet, and lint
    cmds:
      - task: build
      - task: test
      - task: vet
      - task: lint

  run:
    desc: Run the application
    cmds:
      - go run ./cmd/legato

  run:hot:
    desc: Run the built TUI and reload it after successful binary rebuilds
    cmds:
      - ./legato --hot-reload

  server:hot:
    desc: Run the built web server and reload it after successful binary rebuilds
    cmds:
      - ./legato --hot-reload serve --port ${LEGATO_SERVER_PORT:-3080}

  install:
    desc: Install legato to $GOPATH/bin
    env:
      CGO_ENABLED: "0"
    cmds:
      - go install ./cmd/legato/

  link:
    desc: Build legato and symlink it into $GOBIN (defaults to $GOPATH/bin)
    cmds:
      - task: build
      - |
        bin_dir="$(go env GOBIN)"
        bin_dir="${bin_dir:-$(go env GOPATH)/bin}"
        mkdir -p "$bin_dir"
        ln -sfn "{{.ROOT_DIR}}/legato" "$bin_dir/legato"

  web:build:
    desc: Build the frontend
    dir: web
    cmds:
      - pnpm run build

  web:dev:
    desc: Start the frontend dev server
    dir: web
    cmds:
      - pnpm run dev

  server:restart:
    desc: Stop the Legato server, rebuild the embedded web UI, and restart it
    cmds:
      - ./scripts/restart-legato-server.sh

  web:test:
    desc: Run frontend tests
    dir: web
    cmds:
      - pnpm run test

  docs:install:
    desc: Install the docs site's dependencies
    dir: site
    sources: [package.json, pnpm-lock.yaml]
    cmds:
      - pnpm install --frozen-lockfile

  docs:dev:
    desc: Serve the docs site with live reload at http://localhost:4321/legato/
    dir: site
    deps: [docs:install]
    cmds:
      - pnpm run dev

  docs:build:
    desc: Build the docs site into site/dist (fails on a broken link)
    dir: site
    deps: [docs:install]
    cmds:
      - pnpm run build

  mobile:apk:
    desc: Build the Android app's release APK
    cmds:
      - ./scripts/mobile-android.sh apk

  mobile:install:
    desc: Build the Android app, install it on the connected device, and start it
    cmds:
      - ./scripts/mobile-android.sh install

  mobile:test:
    desc: Run the Android app's unit tests
    cmds:
      - ./scripts/mobile-android.sh test

  desktop:test:
    desc: Run the desktop app's Rust tests and check its TypeScript
    dir: desktop
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm exec tsc -b
      - pnpm exec vite build
      - node --test "tests/*.test.ts"
      - pnpm exec vitest run
      - cd src-tauri && cargo test --lib

  desktop:dev:
    desc: Run the desktop app, its shell reloading as you edit
    dir: desktop
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm tauri dev

  desktop:build:
    desc: Build the desktop app's AppImage
    dir: desktop
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm tauri build --bundles appimage

  extension:test:
    desc: Run browser extension tests
    dir: browser-extension
    cmds:
      - pnpm test

  extension:build:
    desc: Build the unpacked Chrome extension
    dir: browser-extension
    cmds:
      - pnpm build

  extension:lint:
    desc: Lint the browser extension
    dir: browser-extension
    cmds:
      - pnpm lint

  packages:install:
    desc: Install the dependencies of the apps under packages/ (one pnpm workspace)
    dir: packages
    sources: [package.json, pnpm-lock.yaml, pnpm-workspace.yaml, "*/package.json"]
    cmds:
      - pnpm install --frozen-lockfile

  packages:check:
    desc: Lint, typecheck and test every app under packages/
    dir: packages
    deps: [packages:install]
    cmds:
      - pnpm run check

  even-hub:dev:
    desc: Serve the Even G2 glasses app at http://127.0.0.1:5173 (the fixture, or LEGATO_URL with LEGATO_TOKEN)
    dir: packages/even-hub
    deps: [packages:install]
    cmds:
      - pnpm run dev

  even-hub:sim:
    desc: Open the Even Hub simulator on the glasses app (run even-hub:dev first)
    dir: packages/even-hub
    deps: [packages:install]
    cmds:
      - pnpm run sim

  even-hub:test:
    desc: Run the glasses app's tests
    dir: packages/even-hub
    deps: [packages:install]
    cmds:
      - pnpm run test

  even-hub:screenshots:
    desc: Run the glasses app in the simulator on the fixture and save screenshots (-- --headless for xvfb-run)
    dir: packages/even-hub
    deps: [packages:install]
    cmds:
      - pnpm run screenshots {{.CLI_ARGS}}

  even-hub:pack:
    desc: Build the glasses app as an .ehpk for the Legato at LEGATO_URL
    dir: packages/even-hub
    deps: [packages:install]
    requires:
      vars: [LEGATO_URL]
    # Given as `task even-hub:pack LEGATO_URL=…` too, which Task does not export.
    env:
      LEGATO_URL: "{{.LEGATO_URL}}"
    cmds:
      - pnpm run pack

  streamdeck:build:
    desc: Build the Stream Deck plugin binary
    dir: streamdeck
    cmds:
      - go build -o plugin/bin/legato-streamdeck ./cmd/legato-streamdeck

  streamdeck:dev:
    desc: Build, deploy to OpenDeck, and restart the plugin (no zip/reload needed)
    dir: streamdeck
    cmds:
      - ./scripts/dev.sh

  streamdeck:package:
    desc: Build and assemble the .sdPlugin folder
    dir: streamdeck
    cmds:
      - task: streamdeck:build
      - ./scripts/package.sh

  install:tools:
    desc: Install development tools
    cmds:
      - go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
