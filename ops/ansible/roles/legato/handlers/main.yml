---
- name: Load the bwrap AppArmor profile
  ansible.builtin.command: apparmor_parser -r /etc/apparmor.d/bwrap
  changed_when: true

- name: Restart Legato
  ansible.builtin.systemd_service:
    name: legato
    scope: user
    state: restarted
    daemon_reload: true
  become: true
  become_user: "{{ legato_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ legato_uid }}"

- name: Restart the metrics timer
  ansible.builtin.systemd_service:
    name: legato-metrics.timer
    state: restarted
    daemon_reload: true
